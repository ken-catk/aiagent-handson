services:
  mcp:
    build:
      context: ./mcp
    working_dir: /app
    volumes:
      - ./mcp:/app
      - /app/node_modules
      - ./logs:/app/logs
    env_file:
      - .env

  agent:
    build:
      context: ./aiagent
    working_dir: /app
    volumes:
      - ./aiagent:/app
      - /app/node_modules
      - ./logs:/app/logs
      # Agent が MCP を stdio で spawn できるよう、MCP ソースを read-only で共有。
      # /app/mcp 配下に置くことで、MCPサブプロセスが @modelcontextprotocol/sdk を
      # /app/node_modules から Node の標準ESM解決で辿れる
      - ./mcp:/app/mcp:ro
    env_file:
      - .env
    depends_on:
      - mcp
